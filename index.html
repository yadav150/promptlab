<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PromptLab · AI Image Generator</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- HEADER -->
    <header class="site-header">
        <div class="header-inner">
            <div class="logo">
                <!-- SVG Sparkle Logo (Primary Color) -->
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L13.5 9.5L21 11L13.5 12.5L12 20L10.5 12.5L3 11L10.5 9.5L12 2Z" fill="#FF0000" />
                </svg>
                <span>PromptLab</span>
            </div>
            <a href="#" class="github-link" target="_blank" rel="noopener">GitHub</a>
        </div>
    </header>

    <!-- MAIN -->
    <main id="main-content">
        <section class="generator-section">
            <h1>Generate Images with AI</h1>
            <p class="subtitle">Describe your vision, and let AI bring it to life.</p>

            <!-- Prompt Input -->
            <div class="form-group">
                <label for="promptInput">Your Prompt</label>
                <textarea id="promptInput" rows="4" placeholder="e.g. A majestic tiger walking through a neon-lit cyberpunk city at midnight"></textarea>
                <span class="error-msg" id="errorMsg" style="display: none;">Please enter a prompt to generate.</span>
            </div>

            <!-- Generate Button -->
            <button id="generateBtn" class="btn btn-primary">Generate Image</button>

            <!-- Output Section (Hidden by default) -->
            <div class="image-section" id="imageSection" style="display: none;">
                <div class="image-wrapper">
                    <img id="outputImage" src="" alt="Generated Image" />
                    <div class="loader" id="loader"></div>
                </div>

                <!-- Action Buttons (Below Image) -->
                <div class="action-buttons">
                    <button id="copyBtn" class="btn btn-outline">
                        <!-- Copy SVG Icon -->
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        <span>Copy Prompt</span>
                    </button>
                    <button id="shareBtn" class="btn btn-outline">
                        <!-- Share SVG Icon -->
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="18" cy="5" r="3"></circle>
                            <circle cx="6" cy="12" r="3"></circle>
                            <circle cx="18" cy="19" r="3"></circle>
                            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                        </svg>
                        <span>Share</span>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast">Copied!</div>

    <script src="app.js"></script>
</body>
</html>
